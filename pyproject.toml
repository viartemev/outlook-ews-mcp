[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "outlook-ews-mcp"
version = "0.1.0"
description = "MCP server for on-prem Microsoft Exchange via EWS with email, calendar, contacts, and availability tools"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
keywords = [
    "mcp",
    "model-context-protocol",
    "exchange",
    "microsoft-exchange",
    "ews",
    "outlook",
    "email",
    "calendar",
    "contacts",
    "automation",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Communications :: Email",
    "Topic :: Office/Business :: Groupware",
]
dependencies = [
    "mcp>=1.0,<2.0",
    "exchangelib>=5.0",
    "pydantic>=2.7",
    "pydantic-settings>=2.2",
    "email-validator>=2.0",
    "requests-ntlm>=1.3",
    "python-dateutil>=2.9",
    "uvicorn>=0.30",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.5",
]

[project.urls]
Homepage = "https://github.com/viartemev/outlook-mcp"
Repository = "https://github.com/viartemev/outlook-mcp"
Issues = "https://github.com/viartemev/outlook-mcp/issues"

[project.scripts]
outlook-ews-mcp = "outlook_mcp.server:main"
outlook-ews-mcp-smoke = "outlook_mcp.smoke:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
