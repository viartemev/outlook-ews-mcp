[build-system]
requires = ["setuptools>=84.0.0,<85", "wheel>=0.48.0,<1"]
build-backend = "setuptools.build_meta"

[project]
name = "outlook-ews-mcp"
version = "0.1.0"
description = "MCP server for on-prem Microsoft Exchange via EWS with email, calendar, contacts, and availability tools"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
keywords = [
    "mcp",
    "model-context-protocol",
    "exchange",
    "microsoft-exchange",
    "ews",
    "outlook",
    "email",
    "calendar",
    "contacts",
    "automation",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Communications :: Email",
    "Topic :: Office/Business :: Groupware",
]
dependencies = [
    "mcp>=1.29,<3.0",
    "exchangelib>=5.0,<6.0",
    "pydantic>=2.7,<3.0",
    "pydantic-settings>=2.15.0,<3.0",
    "email-validator>=2.0,<3.0",
    "requests-ntlm>=1.3,<2.0",
    "uvicorn>=0.30,<1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.2",
    "mypy>=2.3.0",
]

[project.urls]
Homepage = "https://github.com/viartemev/outlook-ews-mcp"
Repository = "https://github.com/viartemev/outlook-ews-mcp"
Issues = "https://github.com/viartemev/outlook-ews-mcp/issues"

[project.scripts]
outlook-ews-mcp = "outlook_mcp.server:main"
outlook-ews-mcp-smoke = "outlook_mcp.smoke:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.uv]
required-version = "==0.12.1"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
# Pin the pre-0.16 default rule set (E4, E7, E9, F) explicitly so future ruff
# releases can't silently widen what CI enforces.
select = ["E4", "E7", "E9", "F"]

[tool.mypy]
python_version = "3.12"
mypy_path = "src"
warn_unused_ignores = true
warn_redundant_casts = true

[[tool.mypy.overrides]]
# exchangelib ships no type stubs or py.typed marker.
module = ["exchangelib.*"]
ignore_missing_imports = true

[tool.coverage.run]
source = ["outlook_mcp"]
