workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH'
    - if: '$CI_COMMIT_TAG'

stages:
  - lint
  - typecheck
  - test
  - security
  - build
  - release

variables:
  UV_CACHE_DIR: .uv-cache
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PYTHONDONTWRITEBYTECODE: "1"
  PYTHONUNBUFFERED: "1"

cache:
  key: "$CI_JOB_IMAGE"
  paths:
    - .uv-cache/

.default_python_job: &default_python_job
  image: python:3.12-slim@sha256:57cd7c3a7a273101a6485ba99423ee568157882804b1124b4dd04266317710de
  before_script:
    - python --version
    - pip install --no-cache-dir uv
    - uv sync --frozen --extra dev

lint:
  stage: lint
  <<: *default_python_job
  script:
    - uv run ruff check .

typecheck:
  stage: typecheck
  <<: *default_python_job
  script:
    - uv run mypy src

test:
  stage: test
  <<: *default_python_job
  script:
    - uv run pytest -q --cov=outlook_mcp --cov-report=term-missing --cov-fail-under=70

security:
  stage: security
  <<: *default_python_job
  script:
    - uv run --with pip-audit pip-audit --strict --local

build_package:
  stage: build
  <<: *default_python_job
  script:
    - uv build
  artifacts:
    when: always
    expire_in: 1 week
    paths:
      - dist/

publish_container:
  stage: release
  image: docker:27@sha256:aa3df78ecf320f5fafdce71c659f1629e96e9de0968305fe1de670e0ca9176ce
  services:
    - name: docker:27-dind@sha256:aa3df78ecf320f5fafdce71c659f1629e96e9de0968305fe1de670e0ca9176ce
  variables:
    DOCKER_TLS_CERTDIR: "/certs"
  before_script:
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
  script:
    - export IMAGE_TAG="${CI_COMMIT_TAG:-$CI_COMMIT_SHORT_SHA}"
    - docker build --pull -t "$CI_REGISTRY_IMAGE:$IMAGE_TAG" .
    - docker push "$CI_REGISTRY_IMAGE:$IMAGE_TAG"
    - |
      if [ "$CI_COMMIT_BRANCH" = "$CI_DEFAULT_BRANCH" ]; then
        docker tag "$CI_REGISTRY_IMAGE:$IMAGE_TAG" "$CI_REGISTRY_IMAGE:latest"
        docker push "$CI_REGISTRY_IMAGE:latest"
      fi
  rules:
    - if: '$CI_COMMIT_TAG'
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
